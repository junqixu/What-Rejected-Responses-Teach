[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning-dpo-pipeline"
version = "0.1.0"
description = "DPO training and evaluation pipeline for structured math reasoning"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "you@example.com"}
]
keywords = ["dpo", "llm", "reasoning", "preference-learning", "deep-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "datasets>=2.18.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "transformers>=4.40.0",
    "torch>=2.0.0",
    "trl>=0.8.0",
    "peft>=0.10.0",
    "accelerate>=0.28.0",
    "vllm>=0.4.0",
    "swanlab>=0.1.0",
    "openai>=1.12.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]

[project.scripts]
run-dag-preference = "stage1_dag_preference.run_pipeline:main"
run-llm-preference = "stage2_llm_generation.run_llm_preference:main"
run-full-dpo = "stage3_training.full_dpo.run_full_dpo:main"
run-lora-dpo = "stage3_training.lora_dpo.run_lora_dpo:main"
run-eval = "stage4_evaluation.vllm_eval.run_eval:main"
run-rq3-batch = "stage5_rq3_experiments.batch_eval:main"
generate-figures = "results.generate_figures:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["stage*", "results", "configs"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
